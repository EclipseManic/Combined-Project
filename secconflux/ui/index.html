<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SecConflux — Unified Security Operations Utility</title>
    <meta
      name="description"
      content="SecConflux unifies malware analysis, IOC enrichment, Windows event log investigation, phishing mail triage, and SIEM rule authoring into one platform."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23818cf8' d='M16 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9L16 17.8 9.8 21.1 11 14.2 6 9.3l6.9-1L16 2z'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("secconflux.theme");
          if (t === "light" || t === "dark") {
            document.documentElement.classList.toggle("dark", t === "dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
