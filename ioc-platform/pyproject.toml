[build-system]
requires = ["setuptools>=75.0", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "ioc-lookup-platform"
version = "0.2.0"
description = "Universal IOC (Indicator of Compromise) Lookup Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["security", "threat-intelligence", "ioc", "lookup"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "aiosqlite==0.20.0",
    "alembic==1.18.4",
    "cryptography==50.0.1",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "mmh3==5.2.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.7.0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "redis==5.2.1",
    "sqlalchemy[asyncio]==2.0.36",
    "starlette==1.3.1",
    "uvicorn[standard]==0.34.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
